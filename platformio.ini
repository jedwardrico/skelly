; PlatformIO project configuration for Skelly, the animatronic skull.
;
; Two environments are defined:
;   esp32dev          - the buildable-today firmware: servo control, MAX98357A audio
;                        playback with jaw sync, and a WiFi JSON/WebSocket control API
;                        for the future React Native / web app.
;   esp32_bluepad32    - a scaffold for adding 8BitDo controller support via BluePad32.
;                        It will NOT build until you follow docs/BLUEPAD32.md and fill
;                        in the platform_packages override for the BluePad32 Arduino
;                        core, because that package URL changes with each BluePad32
;                        release and must be taken from the current docs.
;
; https://docs.platformio.org/en/latest/projectconf/index.html

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
; ESP32-WROVER (PSRAM + more flash than WROOM) is the default target board -
; gives headroom for bigger audio buffers/filesystem now, and enough
; PSRAM/GPIO budget to add an OV2640-style camera module later.
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    madhephaestus/ESP32Servo@^3.2.1
    earlephilhower/ESP8266Audio@^2.0.0
    bblanchon/ArduinoJson@^7.2.0
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
board_build.filesystem = littlefs

[env:esp32dev]
; Default target: builds and flashes today. See docs/WIRING.md for pinout.

[env:esp32_bluepad32]
; DO NOT BUILD until docs/BLUEPAD32.md has been followed - see that file for why.
build_flags =
    ${env.build_flags}
    -DENABLE_BLUEPAD32
lib_deps =
    ${env.lib_deps}
    ; TODO(BLUEPAD32): add the Bluepad32 library dependency per the current
    ; instructions at https://bluepad32.readthedocs.io/en/latest/plat_arduino/
platform_packages =
    ; TODO(BLUEPAD32): override framework-arduinoespressif32 with the Bluepad32
    ; Arduino core release asset named on the docs page above. The exact URL is
    ; tied to a specific Bluepad32 release, so copy it fresh rather than reusing
    ; an old one from a tutorial.
